<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%} Mi proyecto {%endblock%}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<header>
    <nav>
        <h1> Mi proyecto Web </h1>
        <ul class="navbar-nav ms-auto">

    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('inicio') }}">
            <i class="bi bi-house"></i> Inicio
        </a>
    </li>

    {% if current_user.is_authenticated %}
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('productos_listar') }}">
                <i class="bi bi-box"></i> Productos
            </a>
        </li>

        <li class="nav-item">
            <span class="nav-link">
                <i class="bi bi-person-circle"></i> {{ current_user.nombre }}
            </span>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('logout') }}">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </a>
        </li>
    {% else %}
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('registro') }}">
                <i class="bi bi-person-plus"></i> Registro
            </a>
        </li>
    {% endif %}
</ul>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>
    
<footer>
    <p>&copy; 2026 Mi proyecto Web. Todos los derechos reservados.</p>
</footer>
</body>
</html>
