{% extends "base.html" %}
{% block title %}Categorías{% endblock %}

{% block content %}
<div class="card shadow p-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3 class="fw-bold">📂 Categorías</h3>
        <a href="{{ url_for('categoria_nuevo') }}" class="btn btn-primary">➕ Nueva Categoría</a>
    </div>

    <hr>

    <table class="table table-striped table-hover text-center">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for c in categorias %}
            <tr>
                <td>{{ c.id_categoria }}</td>
                <td>{{ c.nombre_categoria }}</td>
                <td>
                    <a href="{{ url_for('categoria_editar', id=c.id_categoria) }}" class="btn btn-warning btn-sm">✏ Editar</a>

                    <form method="POST" action="{{ url_for('categoria_eliminar', id=c.id_categoria) }}" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Seguro que deseas eliminar esta categoría?')">
                            🗑 Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
