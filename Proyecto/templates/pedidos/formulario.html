{% extends "base.html" %}

{% block title %}Nuevo Pedido{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow p-4">
            <h2 class="fw-bold text-center mb-3">🧾 Crear Pedido</h2>

            <form method="POST">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    {{ form.id_cliente.label(class="form-label fw-bold") }}
                    {{ form.id_cliente(class="form-select") }}
                </div>

                <div class="d-grid">
                    {{ form.submit(class="btn btn-success") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
