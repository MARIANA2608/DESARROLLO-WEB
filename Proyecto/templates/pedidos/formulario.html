{% extends "base.html" %}
{% block title %}Nuevo Pedido{% endblock %}

{% block content %}

<div class="container mt-3" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h4 class="mb-0 fw-bold">➕ Crear Pedido</h4>
        </div>

        <div class="card-body">
            <form method="POST">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    {{ form.id_cliente.label(class="form-label fw-bold") }}
                    {{ form.id_cliente(class="form-select") }}
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('pedidos_listar') }}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>

                    {{ form.submit(class="btn btn-success") }}
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
